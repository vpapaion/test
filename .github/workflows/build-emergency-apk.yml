name: Build Elderly SOS APK

on:
  push:
    branches:
      - agent/emergency-call-apk
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct source archive
        run: cat source/source.part* | base64 --decode > EmergencyCallElderly.zip

      - name: Extract Android project
        run: unzip -q EmergencyCallElderly.zip -d project

      - name: Make Gradle launcher executable
        run: chmod +x project/EmergencyCallElderly/gradlew

      - name: Build installable APK
        working-directory: project/EmergencyCallElderly
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare final APK
        run: |
          cp project/EmergencyCallElderly/app/build/outputs/apk/debug/app-debug.apk ElderlySOS-v1.0.apk
          sha256sum ElderlySOS-v1.0.apk > ElderlySOS-v1.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElderlySOS-v1.0
          path: |
            ElderlySOS-v1.0.apk
            ElderlySOS-v1.0.apk.sha256
          if-no-files-found: error
          retention-days: 90
